name: Deploy GitHub Pages demo

# Publishes the static analyzer (apps/pages) to
# https://ratomirjovanovic.github.io/PandaPayLens/
# Only runs for the default branch; pull requests never get Pages
# permissions or secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Core, provider fixture and privacy unit tests
        run: pnpm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build static demo
        run: pnpm build:pages
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Install browser
        run: pnpm --filter @pandapaylens/pages exec playwright install --with-deps chromium
      - name: Smoke and privacy tests against the export
        run: pnpm --filter @pandapaylens/pages run test:e2e
        env:
          CI: "true"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/pages/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    # Post-deployment smoke test against the live site.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pandapaylens/pages exec playwright install --with-deps chromium
      - name: Live smoke tests
        run: pnpm --filter @pandapaylens/pages run test:e2e
        env:
          CI: "true"
          PAGES_URL: https://ratomirjovanovic.github.io/PandaPayLens/
