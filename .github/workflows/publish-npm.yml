name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm trusted publishing: a short-lived OIDC token instead of a stored npm token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./packages/cli/package.json').version")" = "$TAG"
      - run: pnpm build:packages
      - run: node packages/cli/scripts/smoke-pack.mjs
      - name: Publish
        working-directory: packages/cli
        run: |
          version=$(node -p "require('./package.json').version")
          # The first version is published by hand, before trusted publishing
          # can be configured; a re-run must not fail on an existing version.
          if npm view "pandapaylens@$version" version >/dev/null 2>&1; then
            echo "pandapaylens@$version is already on npm."
            exit 0
          fi
          pnpm pack
          npm publish ./pandapaylens-*.tgz --provenance --access public
