name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: README provider table matches the registry
        run: |
          node scripts/update-readme-providers.mjs
          npx prettier --write README.md
          git diff --exit-code README.md
      - name: Bundle size report
        run: node scripts/bundle-report.mjs
      - name: CLI smoke test
        run: |
          node packages/cli/dist/bin.js version
          node packages/cli/dist/bin.js analyze fixtures/stripe/successful-payment.json --fail-on medium
      - name: npm package installs, runs and type-checks
        run: node packages/cli/scripts/smoke-pack.mjs
      - run: pnpm --filter @pandapaylens/web exec playwright install --with-deps chromium
      - name: Static demo build and smoke tests
        run: |
          pnpm --filter @pandapaylens/pages run build
          pnpm --filter @pandapaylens/pages run test:e2e
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: End-to-end and privacy regression tests
        run: pnpm test:e2e
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
